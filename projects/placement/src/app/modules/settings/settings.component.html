<!-- Breadcrumbs outside main content div with small margin -->
<div class="px-6 pt-4">
  <lib-breadcrumbs-title [breadcrumbs]="breadcrumbs" title="Settings"></lib-breadcrumbs-title>
</div>

<div class="px-6 pb-24 mt-2" style="margin-left: 24px; margin-right: 24px; margin-bottom: 24px; box-sizing: border-box; width: calc(100% - 48px);">
  <!-- Tabs -->
  <div class="mb-6">
    <lib-tabs 
      [tabs]="tabs" 
      [activeTabId]="activeTab" 
      [autoWidth]="true"
      (tabChange)="activeTab = $event">
    </lib-tabs>
  </div>

  <!-- Tab Content: Declaration -->
  <div *ngIf="activeTab === 'declaration'" class="flex flex-wrap gap-6">

    <!-- Declaration Form Settings Container -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden flex flex-col"
      style="width: 500px; max-width: 100%;">
      <div class="p-5 border-b border-gray-50 bg-gray-50/30">
        <p class="text-[11px] text-black mt-0.5 leading-snug font-semibold">Terms and conditions document for students.
        </p>
      </div>

      <div class="p-5 flex-1 flex flex-col space-y-5">
        <!-- Edit/Upload Section -->
        <div>
          <lib-file-upload
            accept=".pdf,.doc,.docx"
            title="Select a file or drag and drop here"
            hint="PDF, DOC, DOCX file size no more than 10MB"
            width="100%"
            (fileChange)="onLibFileChange($event)">
          </lib-file-upload>

          <div style="margin-top: 12px;">
            <lib-button 
              [label]="isUpdating ? 'Uploading...' : 'Upload File'" 
              type="primary" 
              [loading]="isUpdating"
              [disabled]="!selectedFile"
              (onClick)="updateDeclaration()"
              customClass="w-full">
            </lib-button>
          </div>
        </div>

        <hr class="border-gray-100" />

        <!-- View Section -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-2">Current File</label>
          <div class="bg-blue-50/50 border border-blue-100 rounded-lg p-3">
            <div class="flex items-start gap-2.5">
              <div class="bg-blue-100 text-blue-600 p-1.5 rounded-md flex-shrink-0">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <polyline points="14 2 14 8 20 8" />
                </svg>
              </div>
              <div style="word-break: break-all; min-w: 0;">
                <p class="text-xs font-semibold text-gray-900 mb-0.5">Declaration Form</p>
                <p *ngIf="!declarationPath" class="text-[10px] text-gray-500 font-mono">No file URL currently set</p>
                <a *ngIf="declarationPath" [href]="declarationPath" target="_blank"
                  class="text-[10px] text-blue-600 hover:underline font-mono truncate block"
                  title="Click to view file">{{ getDisplayFileName() }}</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Future settings containers can be added here inside the grid -->
  </div>

  <!-- Tab Content: General -->
  <div *ngIf="activeTab === 'general'" class="flex flex-wrap gap-6">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden flex flex-col"
      style="width: 500px; max-width: 100%;">
      <div class="p-5 border-b border-gray-50 bg-gray-50/30">
        <h2 class="text-sm font-bold text-gray-900">General Options</h2>
        <p class="text-[11px] text-gray-500 mt-0.5 leading-snug">System-wide general preferences.</p>
      </div>
      <div class="p-5">
        <p class="text-xs text-gray-500">More settings blocks can be added in this tab as the app scales.</p>
      </div>
    </div>
  </div>
</div>
