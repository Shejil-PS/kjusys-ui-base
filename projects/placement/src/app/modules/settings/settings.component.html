<div class="px-6 pb-24" style="padding-top: 30px; box-sizing: border-box; width: 100%;">
  <!-- Breadcrumb + Title -->
  <div style="margin-bottom: 28px;">
    <div style="font-family:'DM Sans',sans-serif; font-size:12px; color:#989898; margin-bottom:4px;">
      Placements / <span style="color:#111827; font-weight:700;">Settings</span>
    </div>
    <h1 style="font-family:'DM Sans',sans-serif; font-size:18px; font-weight:400; color:#000; margin:0;">Settings</h1>
  </div>

  <!-- Settings Grid -->
  <div class="flex flex-wrap gap-6">
    
    <!-- Declaration Form Settings Container -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden flex flex-col w-[280px]">
      <div class="p-5 border-b border-gray-50 bg-gray-50/30">
        <h2 class="text-sm font-bold text-gray-900">Declaration Form</h2>
        <p class="text-[11px] text-gray-500 mt-0.5 leading-snug">Terms and conditions document for students.</p>
      </div>

      <div class="p-5 flex-1 flex flex-col space-y-5">
        <!-- Edit/Upload Section -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Upload File</label>
          
          <div class="relative border-2 border-dashed border-gray-200 rounded-xl bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer text-center py-5">
            <input type="file" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            
            <svg *ngIf="!selectedFileName" width="24" height="24" fill="none" stroke="#9CA3AF" stroke-width="1.5" viewBox="0 0 24 24" class="mx-auto mb-1.5 text-gray-400">
              <polyline points="16 16 12 12 8 16" />
              <line x1="12" y1="12" x2="12" y2="21" />
              <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" />
            </svg>
            
            <p *ngIf="!selectedFileName" class="text-xs font-medium text-gray-700">Click or drag file</p>
            <p *ngIf="!selectedFileName" class="text-[10px] text-gray-400 mt-0.5">PDF, DOC, DOCX</p>

            <div *ngIf="selectedFileName" class="flex flex-col items-center justify-center gap-1.5 px-2">
              <svg width="20" height="20" fill="none" stroke="#2563EB" stroke-width="2" viewBox="0 0 24 24">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <polyline points="13 2 13 9 20 9"></polyline>
              </svg>
              <p class="text-[11px] font-semibold text-blue-600 truncate w-full">{{ selectedFileName }}</p>
              <p class="text-[10px] text-gray-500">Click to change</p>
            </div>
          </div>
          
          <button (click)="updateDeclaration()" [disabled]="isUpdating || !selectedFile"
            class="w-full mt-3 px-4 py-2 rounded-lg font-bold text-xs text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors flex items-center justify-center gap-2 disabled:opacity-50">
            <span *ngIf="isUpdating" class="border-2 border-white/30 border-t-white rounded-full w-3.5 h-3.5 animate-spin"></span>
            {{ isUpdating ? 'Uploading...' : 'Upload File' }}
          </button>
        </div>

        <hr class="border-gray-100" />

        <!-- View Section -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-2">Current File</label>
          <div class="bg-blue-50/50 border border-blue-100 rounded-lg p-3">
            <div class="flex items-start gap-2.5">
              <div class="bg-blue-100 text-blue-600 p-1.5 rounded-md flex-shrink-0">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <polyline points="14 2 14 8 20 8" />
                </svg>
              </div>
              <div style="word-break: break-all; min-w: 0;">
                <p class="text-xs font-semibold text-gray-900 mb-0.5">Declaration Form</p>
                <p *ngIf="!declarationPath" class="text-[10px] text-gray-500 font-mono">No file URL currently set</p>
                <a *ngIf="declarationPath" [href]="declarationPath" target="_blank" class="text-[10px] text-blue-600 hover:underline font-mono truncate block" title="Click to view file">{{ getDisplayFileName() }}</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Future settings containers can be added here inside the grid -->
  </div>
</div>
